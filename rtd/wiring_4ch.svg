<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620"><rect width="1000" height="620" fill="#f5f7fa"/><g font-family="Arial" fill="#182435"><text x="40" y="45" font-size="25">STM32F411 Black Pill — 4 × MAX31865</text><text x="40" y="80" font-size="17">Общие линии: PA5 → SCK; PA7 → SDI; PA6 ← SDO; GND ↔ GND</text><rect x="40" y="110" width="920" height="85" rx="10" fill="white" stroke="#a7b4c4"/><text x="60" y="142" font-size="21">T1 / GUI T0</text><text x="340" y="142" font-size="21">PA3 → CS</text><text x="650" y="142" font-size="21">PB10 ← DRDY</text><text x="340" y="172" font-size="16">Отдельные CS и DRDY; DRDY между собой не соединять.</text><rect x="40" y="215" width="920" height="85" rx="10" fill="white" stroke="#a7b4c4"/><text x="60" y="247" font-size="21">T2 / GUI T1</text><text x="340" y="247" font-size="21">PB0 → CS</text><text x="650" y="247" font-size="21">PB12 ← DRDY</text><text x="340" y="277" font-size="16">Отдельные CS и DRDY; DRDY между собой не соединять.</text><rect x="40" y="320" width="920" height="85" rx="10" fill="white" stroke="#a7b4c4"/><text x="60" y="352" font-size="21">T3 / GUI T2</text><text x="340" y="352" font-size="21">PB1 → CS</text><text x="650" y="352" font-size="21">PB15 ← DRDY</text><text x="340" y="382" font-size="16">Отдельные CS и DRDY; DRDY между собой не соединять.</text><rect x="40" y="425" width="920" height="85" rx="10" fill="white" stroke="#a7b4c4"/><text x="60" y="457" font-size="21">T4 / GUI T3</text><text x="340" y="457" font-size="21">PA2 → CS</text><text x="650" y="457" font-size="21">PA8 ← DRDY</text><text x="340" y="487" font-size="16">Отдельные CS и DRDY; DRDY между собой не соединять.</text><text x="40" y="560" font-size="17">Питание модулей — по их маркировке; логика SPI 3.3 В. PA11/PA12 — USB.</text><text x="40" y="590" font-size="17">PA13/PA14 — SWD. DRDY: T1–T3 — EXTI15_10; T4 — EXTI9_5.</text></g></svg>